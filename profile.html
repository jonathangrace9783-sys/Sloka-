<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile • AfterDark AU</title>

  <meta
    name="description"
    content="AfterDark AU fictional demo profile."
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="container header-inner">

      <a
        class="logo"
        href="index.html"
      >
        AfterDark <span>AU</span>
      </a>

      <a
        class="back-link"
        href="index.html"
      >
        ← Back to listings
      </a>

    </div>

  </header>


  <!-- =========================
       PROFILE
  ========================== -->

  <main class="profile-page">

    <div class="container">

      <div id="profileRoot"></div>

    </div>

  </main>


  <!-- =========================
       DATA
  ========================== -->

  <script src="js/seed-data.js"></script>


  <!-- =========================
       PROFILE SCRIPT
  ========================== -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      "use strict";

      const root =
        document.getElementById("profileRoot");

      const params =
        new URLSearchParams(
          window.location.search
        );

      const profileId =
        params.get("id");

      const profiles =
        Array.isArray(
          window.afterdarkDemoProfiles
        )
          ? window.afterdarkDemoProfiles
          : [];


      /* =====================================
         ESCAPE HTML
      ====================================== */

      function escapeHtml(value) {

        return String(value ?? "").replace(
          /[&<>"']/g,
          character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[character]
        );

      }


      /* =====================================
         FIND PROFILE
      ====================================== */

      const profile =
        profiles.find(
          item => item.id === profileId
        );


      /* =====================================
         PROFILE NOT FOUND
      ====================================== */

      if (!profile) {

        root.innerHTML = `
          <div class="empty">

            <h2>
              Profile not found
            </h2>

            <p>
              The requested demo profile
              could not be found.
            </p>

            <a
              class="btn primary"
              href="index.html"
            >
              Back to listings
            </a>

          </div>
        `;

        return;
      }


      /* =====================================
         IMAGE
      ====================================== */

      const image =
        profile.photos?.[0] ||
        "assets/images/profiles/placeholder.svg";


      /* =====================================
         PROFILE PAGE
      ====================================== */

      root.innerHTML = `

        <div class="profile-card">

          <div>

            <img
              class="profile-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(profile.displayName)}"
            >

          </div>


          <div class="profile-info">

            <div class="eyebrow">
              PROFILE
            </div>


            <h1>

              ${escapeHtml(
                profile.displayName
              )}

              ${
                profile.verified
                  ? `
                    <span class="verified">
                      ✓ Verified
                    </span>
                  `
                  : ""
              }

            </h1>


            <p class="profile-meta">

              ${escapeHtml(profile.city)},
              ${escapeHtml(profile.state)}

              •
              
              ${escapeHtml(profile.category)}

            </p>


            <p>
              ${escapeHtml(
                profile.description
              )}
            </p>


            <div class="details">

              <div>

                <strong>
                  Age
                </strong>

                <span>
                  ${escapeHtml(profile.age)}
                </span>

              </div>


              <div>

                <strong>
                  City
                </strong>

                <span>
                  ${escapeHtml(profile.city)}
                </span>

              </div>


              <div>

                <strong>
                  Category
                </strong>

                <span>
                  ${escapeHtml(profile.category)}
                </span>

              </div>

            </div>


            <a
              class="btn primary"
              href="index.html"
            >
              Back to listings
            </a>

          </div>

        </div>

      `;


      /* =====================================
         UPDATE BROWSER TITLE
      ====================================== */

      document.title =
        `${profile.displayName} • AfterDark AU`;

    });
  </script>

</body>
</html>
