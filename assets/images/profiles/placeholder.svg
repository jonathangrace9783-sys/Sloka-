<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 800"
>
  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#22172b"
      />

      <stop
        offset="100%"
        stop-color="#101014"
      />
    </linearGradient>
  </defs>


  <!-- Background -->

  <rect
    width="800"
    height="800"
    fill="url(#background)"
  />


  <!-- Abstract profile -->

  <circle
    cx="400"
    cy="310"
    r="120"
    fill="#39313f"
  />


  <path
    d="
      M180 680
      C215 530 300 460 400 460
      C500 460 585 530 620 680
      Z
    "
    fill="#39313f"
  />


  <!-- Decorative border -->

  <rect
    x="25"
    y="25"
    width="750"
    height="750"
    rx="30"
    fill="none"
    stroke="#5b4568"
    stroke-width="3"
  />


  <!-- Brand -->

  <text
    x="400"
    y="735"
    text-anchor="middle"
    fill="#d8a0ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
  >
    AFTERDARK AU
  </text>

</svg>
